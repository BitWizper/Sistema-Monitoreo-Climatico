# Despliegue automático a GitHub Pages (HTTPS) — Rol A
# Cada push a "main" publica la app. Activar antes en:
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
name: Desplegar PWA en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: Verificar archivos PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/verify-pwa.mjs

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Preparar carpeta pública (sin .git, docs ni scripts)
        run: |
          mkdir _site
          cp -r index.html styles.css app.js *Service.js service-worker.js \
                manifest.webmanifest pwa-install.js icons .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
